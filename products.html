<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部商品</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-blue-600">简易商城</a>
            <div class="space-x-6">
                <a href="index.html" class="text-gray-700 hover:text-blue-600">首页</a>
                <a href="products.html" class="text-gray-700 hover:text-blue-600">全部商品</a>
                <a href="cart.html" class="text-gray-700 hover:text-blue-600">
                    <i class="fa fa-shopping-cart"></i> 购物车 <span id="cart-count" class="bg-red-500 text-white px-2 rounded-full text-xs">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 pt-24 pb-16">
        <h2 class="text-3xl font-bold mb-8">全部商品</h2>
        <div id="goods-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
    </div>

    <footer class="bg-gray-800 text-white py-10 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>©2026 简易电商 静态演示网站 | 仅演示，无真实交易</p>
        </div>
    </footer>

    <script>
        function updateCartCount(){
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cart-count').innerText = cart.reduce((sum,item)=>sum+item.num,0);
        }

        async function loadAllGoods(){
            const res = await fetch('./data/goods.json');
            const goods = await res.json();
            const wrap = document.getElementById('goods-list');
            wrap.innerHTML = '';
            goods.forEach(item=>{
                wrap.innerHTML += `
                <div class="bg-white rounded-xl shadow overflow-hidden hover:shadow-lg transition">
                    <img src="${item.img}" class="w-full h-60 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-lg">${item.name}</h3>
                        <p class="text-red-500 font-bold text-xl mt-2">¥${item.price}</p>
                        <p class="text-gray-500 text-sm mt-1">库存：${item.stock}</p>
                        <a href="product-detail.html?id=${item.id}" class="block mt-4 bg-blue-600 text-white text-center py-2 rounded hover:bg-blue-700">查看详情</a>
                    </div>
                </div>
                `
            })
            updateCartCount();
        }
        loadAllGoods();
    </script>
</body>
</html>
