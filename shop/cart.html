<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-blue-600">简易商城</a>
            <div class="space-x-6">
                <a href="index.html" class="text-gray-700 hover:text-blue-600">首页</a>
                <a href="products.html" class="text-gray-700 hover:text-blue-600">全部商品</a>
                <a href="cart.html" class="text-gray-700 hover:text-blue-600">
                    <i class="fa fa-shopping-cart"></i> 购物车 <span id="cart-count" class="bg-red-500 text-white px-2 rounded-full text-xs">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 pt-24 pb-16">
        <h2 class="text-3xl font-bold mb-8">🛒 我的购物车</h2>
        <div id="cart-wrap">
        </div>
        <div id="order-form" class="mt-10 bg-white p-6 rounded-lg shadow">
            <h3 class="text-xl font-bold mb-4">提交订单（演示）</h3>
            <div class="grid md:grid-cols-2 gap-4">
                <input type="text" id="name" placeholder="收货人姓名" class="border p-2 rounded w-full">
                <input type="tel" id="phone" placeholder="手机号码" class="border p-2 rounded w-full">
                <input type="text" id="address" placeholder="收货详细地址" class="border p-2 rounded w-full md:col-span-2">
            </div>
            <button onclick="submitOrder()" class="mt-6 bg-green-600 text-white px-6 py-3 rounded hover:bg-green-700">提交订单</button>
            <p class="mt-4 text-gray-500 text-sm">提交后仅收集信息，人工联系您收款</p>
        </div>
    </div>

    <footer class="bg-gray-800 text-white py-10 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>©2026 简易电商 静态演示网站 | 仅演示，无真实交易</p>
        </div>
    </footer>

    <script>
        function updateCartCount(){
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cart-count').innerText = cart.reduce((sum,item)=>sum+item.num,0);
        }

        function renderCart(){
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const wrap = document.getElementById('cart-wrap');
            if(cart.length ===0){
                wrap.innerHTML = "<div class='bg-white p-10 rounded-lg text-center'><p class='text-xl'>购物车是空的</p><a href='products.html' class='inline-block mt-4 text-blue-600'>去选购商品</a></div>";
                return;
            }
            let html = `<div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-3 text-left">商品</th>
                        <th class="p-3">单价</th>
                        <th class="p-3">数量</th>
                        <th class="p-3">小计</th>
                        <th class="p-3">操作</th>
                    </tr>
                </thead><tbody>`;
            let total = 0;
            cart.forEach((item,idx)=>{
                const sub = item.price * item.num;
                total += sub;
                html += `
                <tr class="border-b">
                    <td class="p-3 flex items-center gap-3">
                        <img src="${item.img}" width="80" class="rounded"> ${item.name}
                    </td>
                    <td class="p-3 text-center">¥${item.price}</td>
                    <td class="p-3 text-center">
                        <button onclick="changeNum(${idx},-1)" class="border px-2">-</button>
                        <span class="mx-2">${item.num}</span>
                        <button onclick="changeNum(${idx},1)" class="border px-2">+</button>
                    </td>
                    <td class="p-3 text-center">¥${sub}</td>
                    <td class="p-3 text-center">
                        <button onclick="delItem(${idx})" class="text-red-500">删除</button>
                    </td>
                </tr>
                `
            })
            html += `</tbody></table></div>
            <div class="mt-4 text-right text-xl font-bold">合计：¥${total}</div>`;
            wrap.innerHTML = html;
            updateCartCount();
        }

        function changeNum(index, delta){
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart[index].num += delta;
            if(cart[index].num <=0) cart.splice(index,1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function delItem(index){
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index,1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function submitOrder(){
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            if(!name||!phone||!address){
                alert('请填写完整收货信息');
                return;
            }
            alert(`订单提交成功！\n姓名：${name}\n手机：${phone}\n地址：${address}\n我们会联系您收款`);
            localStorage.removeItem('cart');
            renderCart();
        }
        renderCart();
    </script>
</body>
</html>
